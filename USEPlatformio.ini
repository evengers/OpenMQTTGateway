; OpenMQTTGateway ESP32 with PicoMQTT Embedded Broker
; For ESP32-D0WD-V3 (Mac mini M1 compatible build)
; Version: 1.8.0+

[platformio]
default_envs = esp32-ble-broker
description = OpenMQTTGateway ESP32 with Embedded MQTT Broker

[com.esp32_platform]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

[env:esp32-ble-broker]
extends = com.esp32_platform
board = esp32dev
board_build.partitions = min_spiffs.csv

lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  h2zero/NimBLE-Arduino@^1.4.2
  mlesniew/PicoMQTT@^0.3.9

build_flags =
  ; ===== ENABLE EMBEDDED BROKER MODE =====
  -DMQTT_BROKER_MODE=1
  
  ; ===== Core Gateway Settings =====
  -DGateway_Name="OpenMQTTGateway_ESP32"
  -DBase_Topic="home/"
  
  ; ===== Enable BLE Gateway =====
  -DZgatewayBT="BT"
  
  ; ===== WiFi Configuration (optional - can use WebUI) =====
  ; -DWIFI_SSID="YourSSID"
  ; -DWIFI_PASSWORD="YourPassword"
  
  ; ===== Broker Settings (runs on ESP32) =====
  -DMQTT_PORT=1883
  ; If you want to also connect to external broker as client:
  ; -DMQTT_SERVER="192.168.1.x"  ; External broker IP
  
  ; ===== Performance Tuning =====
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_FREERTOS_UNICORE=0
  
  ; ===== Optional: Enable Home Assistant Discovery =====
  -DZmqttDiscovery="HADiscovery"
  -DjsonPublishing=true
  -DjsonReceiving=true

monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool

; ===== Alternative environments =====

; Client-only mode (connect to external broker)
[env:esp32-ble-client]
extends = com.esp32_platform
board = esp32dev
board_build.partitions = min_spiffs.csv

lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  h2zero/NimBLE-Arduino@^1.4.2
  knolleary/PubSubClient@^2.8

build_flags =
  -DMQTT_BROKER_MODE=0
  -DZgatewayBT="BT"
  -DGateway_Name="OpenMQTTGateway_ESP32"
  -DBase_Topic="home/"
  ; Set your external broker here:
  -DMQTT_SERVER="192.168.1.x"
  -DMQTT_PORT=1883
  
monitor_speed = 115200
upload_speed = 921600
