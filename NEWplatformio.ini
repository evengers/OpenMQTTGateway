; platformio.ini for OpenMQTTGateway ESP32 with PicoMQTT enabled
; This combines and prunes the original platformio.ini and environments.ini from https://github.com/1technophile/OpenMQTTGateway
; Focus: ESP32 board (esp32dev), Arduino framework, PicoMQTT as the MQTT library for client/broker functionality.
; Removed ESP8266/STM32 envs, unnecessary libs/protocols (e.g., RF, IR, BLE unless core), and OTA-specific overrides.
; Use: Place in project root, run 'pio run -e esp32-picomqtt' to build/flash.

[platformio]
default_envs = esp32-picomqtt
description = OpenMQTTGateway ESP32 with PicoMQTT
version = 1.0.0

; Common ESP32 settings (pruned from original)
[com.esp32_platform]
platform = espressif32 @ ^6.5.0  ; Recent stable for ESP32-D0WD-V3 support
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
debug_tool = esp-prog
lib_ldf_mode = deep+

; Common build flags (pruned: core MQTT, WiFi, no protocol extras)
[com-esp.build_flags]
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_USE_ESP_EVENT
  ; MQTT core flags
  -DZgatewayMQTT="MQTT"
  -DGateway_Name="OpenMQTTGateway_ESP32_PicoMQTT"
  -DGateway_Device="ESP32_PicoMQTT"
  -DVERSION="1.8.0"  ; Update as needed
  ; WiFi/MQTT essentials
  -DWIFI_MANAGER_SECURE=true
  -DUSE_MQTT_TLS  ; Enable if using secure broker

; Common lib deps (pruned: core only, add PicoMQTT)
[com-esp.lib_deps]
lib_deps =
  ; Core Arduino libs (already in framework)
  ; bblanchon/ArduinoJson@^6.21.3  ; For config/JSON handling
  ; me-no-dev/AsyncTCP@^1.1.1
  ; me-no-dev/ESPAsyncWebServer@^1.2.3
  ; Core for MQTT (will be overridden by PicoMQTT)
  arduino-libraries/Arduino_JSON@^0.1.0

; ESP32 PicoMQTT environment (new, focused/pruned for your ESP32-D0WD-V3)
[env:esp32-picomqtt]
extends = com.esp32_platform
lib_deps =
  ${com-esp.lib_deps}
  mlesniew/PicoMQTT@^1.0.0  ; Enables PicoMQTT as MQTT client/broker [web:24]

build_flags =
  ${com-esp.build_flags}
  ; PicoMQTT-specific: Enable broker mode if needed (default client)
  -DUSE_PICOMQTT_BROKER=true  ; Set false for client-only
  ; Board-specific for your ESP32-D0WD-V3 (40MHz crystal, dual-core)
  -DCONFIG_FREERTOS_UNICORE=0
  -DESP32_DEFAULT_CPU_FREQ_240=1
  ; No extra protocols: Focus on MQTT/WiFi
  -UZgatewayRF
  -UZgatewayIR
  -UZgatewayBT

board_build.partitions = default_8MB.csv  ; Standard for ESP32 with WiFi/MQTT
; Optional: For low memory if needed
; board_build.ldscript = eagle.flash.1m.ld

; Upload/Monitor (USB default, add OTA if needed)
upload_protocol = esptool
; For OTA: upload_protocol = espota ; upload_port = 192.168.x.x ; upload_flags = --auth=yourpass --port=8266

; Custom matrix for variants (pruned: only ESP32)
[matrix_esp32]
default_envs =
  esp32-picomqtt  ; Main env for PicoMQTT focus

; End of pruned/combined config
; Notes: 
; - Clone OpenMQTTGateway repo, replace platformio.ini with this, adjust WiFi/MQTT creds in main sketch or via WebUI.
; - PicoMQTT replaces default PubSubClient for lighter broker support on ESP32 [web:24][web:26][web:34].
; - Test: pio run -e esp32-picomqtt --target upload
; - For your MAC (d4:e9:f4:c5:10:4c), no change needed; it's hardware-set.
; - If adding protocols (e.g., BLE), un-comment and add flags/libs from original.
